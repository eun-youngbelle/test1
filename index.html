<title>석이랑 녕이랑</title>

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161a;--card:#1f1f25;--text:#f3f4f6;--mute:#9ca3af;--line:#34343c;--red:#fb7185;--blue:#7dd3fc;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16161a;--card:#1f1f25;--text:#f3f4f6;--mute:#9ca3af;--line:#34343c;--red:#fb7185;--blue:#7dd3fc;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.app{max-width:520px;margin:0 auto;padding:0 12px 110px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 4px 8px}
h1{font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;font-size:23px;font-weight:700;letter-spacing:-.7px;margin:0}
.duo{display:flex;align-items:center;gap:5px;font-size:24px;line-height:1}.duo i{font-style:normal;color:var(--pink);font-size:15px}
button,input{font:inherit;color:inherit}

button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--pink);border-color:var(--pink);color:#fff}
button.sm{padding:4px 10px;font-size:12px;border-radius:99px}
input[type=text],input[type=time],input[type=date]{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;font-size:16px}
.dd{display:flex;gap:10px;margin:2px 0 12px}
.dc{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer}
.dc small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc .v{font-size:22px;font-weight:700;color:var(--pink);margin:2px 0}
.nav{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.nt{display:flex;align-items:center;gap:8px}.nt b{font-size:19px;font-weight:700}
.ic{border:0;background:transparent;color:var(--mute);font-size:13px;padding:4px 8px;cursor:pointer;border-radius:8px}
.nav .ic{font-size:28px;line-height:1;padding:0 14px}
.legend{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.lg{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer}
.lg.off{opacity:.35}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dow{background:var(--card);text-align:center;font-size:12px;color:var(--mute);padding:8px 0}.dow:first-child{color:var(--red)}.dow:nth-child(7){color:var(--blue)}
.day{background:var(--card);min-height:74px;padding:3px;cursor:pointer;position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.day.sel{background:color-mix(in srgb,var(--pink) 20%,var(--card))}
.day.out{opacity:.4}
.num{font-size:12px;margin:1px 2px 3px;display:flex;align-items:center;gap:3px;min-width:0}
.num b{font-weight:500;border-radius:99px;padding:0 5px;min-width:20px;text-align:center}
.num i{font-style:normal;font-size:9px;color:var(--red);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num i.ann{color:var(--pink)}
.day.hol .num b,.day.sun .num b{color:var(--red)}.day.sat .num b{color:var(--blue)}
.day.hol:not(.sel){background:color-mix(in srgb,var(--red) 7%,var(--card))}
.today .num b{color:#fff!important;background:var(--pink)}
.chip{color:#fff;font-size:10px;border-radius:6px;padding:1px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:17px;line-height:15px;position:relative;z-index:2}
.chip.cl{border-top-left-radius:0;border-bottom-left-radius:0}.chip.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.lane{height:19px}
.more{font-size:10px;color:var(--mute);padding-left:3px}
.banner{background:#fef3c7;color:#78350f;border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs>div{display:flex;width:100%;max-width:520px;align-items:flex-end}
.tabs button{flex:1;border:0;background:none;border-radius:0;padding:4px 0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px}
.tabs button.cur{color:var(--pink)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs .fab{flex:none;width:54px;height:54px;border-radius:50%;background:var(--pink);color:#fff;margin:0 8px;transform:translateY(-14px);justify-content:center;padding:0;box-shadow:0 6px 16px color-mix(in srgb,var(--pink) 45%,transparent)}
.tabs .fab svg{width:26px;height:26px;stroke-width:2.4}
.stat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#111827;color:#fff;border-radius:99px;padding:8px 14px;font-size:14px;z-index:29}.stat:empty{display:none}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;max-width:90vw}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .15s}
.md{background:var(--card);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
.md::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.6}}@keyframes fade{from{opacity:0}}
.md h3{margin:0 0 12px;font-size:19px;font-weight:700}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw span{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw span.on{border-color:var(--text)}
.mh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.mt{font-size:20px;font-weight:700}.ms{font-size:13px;color:var(--red);margin-top:2px}
.mh .ic{font-size:26px;line-height:1;padding:0 8px}
.ec{display:flex;align-items:flex-start;gap:8px;border-left:4px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 6px 10px 12px;margin-bottom:8px}
.ec .t{flex:1;min-width:0}.ec .tt{font-weight:600;font-size:15px}.ec small{color:var(--mute);font-size:12px}
.ec .dn{color:var(--pink);align-self:center;white-space:nowrap}
.empty{color:var(--mute);font-size:14px;padding:2px 0 6px}
.fm{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.fl{font-size:12px;font-weight:600;color:var(--mute)}
input.tin[type=text]{border:0;border-bottom:2px solid var(--line);border-radius:0;padding:6px 2px;font-size:18px;background:transparent;outline:none}
input.tin[type=text]:focus{border-color:var(--pink)}
.ff{display:flex;align-items:center;gap:10px}.fk{width:34px;flex:none;font-size:12px;color:var(--mute)}
.fv{flex:1;display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.fv input{min-width:0;flex:1;padding:8px;font-size:16px;border-radius:10px}
.pn{font-size:12px;color:var(--mute)}
.seg{display:flex;gap:6px;flex:1}.seg button{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;padding:8px}
.seg button.on{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 10%,var(--card));font-weight:600}
.big{width:100%;padding:12px;font-size:15px;font-weight:600;border-radius:14px}
.att{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.att img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer}
.att a{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:inherit;text-decoration:none;background:var(--card)}
.nt b,.mt,.dc .v,.ec .dn,.md h3{font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;font-weight:700;letter-spacing:-.45px}.nt b{font-size:20px}.mt{font-size:21px}.dc .v{font-size:23px}
</style>
</head>

const COLORS=['#3b82f6','#10b981','#f59e0b','#8b5cf6','#14b8a6','#f97316','#84cc16','#6366f1','#0ea5e9','#a16207'];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
let db=null,user=null,sample=null,me=null,members={},events=[],hidden=new Set(),view=new Date();
view.setDate(1);
try{me=JSON.parse(localStorage.getItem('me')||'null')}catch(e){}
const colorOf=e=>e.shared?PINK:(members[e.owner]&&members[e.owner].color)||'#9ca3af';
const visible=e=>!hidden.has(e.shared?'__shared':e.owner);
const nameOf=id=>(members[id]&&members[id].name)||'친구';

function toast(m){const t=el('div','toast',m);document.body.append(t);setTimeout(()=>t.remove(),3200)}
function modal(build){const ov=el('div','ov'),md=el('div','md');ov.append(md);build(md,()=>ov.remove());ov.onclick=e=>{if(e.target===ov)ov.remove()};document.body.append(ov)}

let ddays=[],since=null,A={};
function buildA(){
  A={};if(!since)return;const s=new Date(since+'T00:00:00');
  for(let n=1;n<=40;n++){const d=new Date(s);d.setDate(d.getDate()+n*100-1);A[ymd(d)]=n*100+'일'}
  for(let y=1;y<=15;y++)A[ymd(new Date(s.getFullYear()+y,s.getMonth(),s.getDate()))]=y+'주년';
}
function renderHead(){
  $('#h1').textContent='석이랑 녕이랑';
}
function setSince(){
  modal((md,close)=>{
    md.append(el('h3',null,'만난 날(시작일)'));
    const di=el('input');di.type='date';di.value=since||ymd(new Date());
    const ok=el('button','primary','저장');ok.style.marginTop='12px';
    ok.onclick=async()=>{
      if(!di.value)return;
      try{if(db)await db.collection('settings').doc('couple').set({since:di.value});else{since=di.value;buildA();render()}close()}
      catch(e){toast('저장 권한이 없어요')}
    };
    md.append(di,ok);
  });
}
function dleft(k){const a=new Date(k+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.round((a-n)/864e5)}
function nextDD(){
  const L=ddays.filter(x=>dleft(x.date)>=0).map(x=>({t:x.title,d:x.date}));
  Object.keys(A).filter(k=>dleft(k)>=0).sort().slice(0,1).forEach(k=>L.push({t:'♥ '+A[k],d:k}));
  L.sort((a,b)=>a.d.localeCompare(b.d));return L[0];
}
function renderDD(){
  const bx=$('#dd');bx.textContent='';
  const c1=el('div','dc');c1.append(el('small',null,'우리가 함께한 지'));
  c1.append(el('div','v',since&&dleft(since)<=0?(1-dleft(since))+'일':'—'));
  c1.append(el('small',null,since?since.replace(/-/g,'. '):'만난 날을 알려 주세요'));
  c1.onclick=since?openDD:setSince;
  const n=nextDD(),c2=el('div','dc');c2.append(el('small',null,'다가오는 D-day'));
  c2.append(el('div','v',n?(dleft(n.d)===0?'D-DAY':'D-'+dleft(n.d)):'—'));
  c2.append(el('small',null,n?n.t:'D-day를 만들어 보세요'));c2.onclick=openDD;
  bx.append(c1,c2);
}
function openDD(){
  modal((md,close)=>{
    const draw=()=>{

    const w0=days[0].k,w6=days[6].k;
    const segs=vis.filter(e=>e.date<=w6&&(e.endDate||e.date)>=w0).map(e=>{
      const end=e.endDate||e.date;
      return{e,a:e.date<w0?0:days.findIndex(x=>x.k===e.date),b:end>w6?6:days.findIndex(x=>x.k===end),cl:e.date<w0,cr:end>w6};
    }).sort((x,y)=>x.a-y.a||(y.b-y.a)-(x.b-x.a)||(x.e.start||'').localeCompare(y.e.start||''));
    const lanes=[];
    segs.forEach(sg=>{let l=0;while(lanes[l]>=sg.a)l++;lanes[l]=sg.b;sg.l=l});
    const nl=Math.min(3,lanes.length);
    days.forEach((x,i)=>{
      const dw=x.d.getDay();
      const c=el('div','day'+(x.d.getMonth()!==view.getMonth()?' out':'')+(x.k===today?' today':'')+(H[x.k]?' hol':dw===0?' sun':dw===6?' sat':''));

      c.dataset.k=x.k;c.append(nm);
      for(let l=0;l<nl;l++){
        const sg=segs.find(q=>q.l===l&&q.a===i);
        if(sg){
          const sp=sg.b-sg.a+1,e=sg.e;
          const ch=el('div','chip'+(sg.cl?' cl':'')+(sg.cr?' cr':''),(e.start&&sp===1?e.start+' ':'')+(e.shared?'♥ ':'')+(hasAtt(e)?'📎 ':'')+e.title);
          ch.style.background=colorOf(e);ch.style.width='calc('+sp+'*100% + '+7*(sp-1)+'px)';c.append(ch);
        }else c.append(el('div','lane'));
      }
      const more=segs.filter(q=>q.l>=3&&q.a<=i&&q.b>=i).length;
      if(more)c.append(el('div','more','+'+more));
      g.append(c);
    });
  }
}

// ---- image import ----
async function shrink(file){
  const bmp=await createImageBitmap(file),sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.85));
}
async function importImage(file){
  if(!me){openSetup();return}
  const stat=$('#imgStat');
  stat.textContent='AI가 사진에서 일정을 찾는 중이에요…';
  try{
    if(file.size>12*1024*1024)throw Error('12MB 이하의 이미지를 선택해 주세요.');
    const blob=await shrink(file);
    const dataURL=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('이미지를 읽지 못했어요.'));r.readAsDataURL(blob)});
    const resp=await fetch('/.netlify/functions/read-schedule',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:dataURL,today:ymd(new Date())})
    });
    const result=await resp.json().catch(()=>({}));
    if(!resp.ok)throw Error(result.error||'이미지 분석 서비스가 응답하지 않았어요.');
    const valid=(Array.isArray(result.events)?result.events:[]).filter(x=>x&&typeof x.title==='string'&&x.title.trim()&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&!Number.isNaN(new Date(x.date+'T00:00:00').getTime()));
    stat.textContent='';
    if(!valid.length){toast('사진에서 일정을 찾지 못했어요. 다른 사진으로 시도해 주세요.');return}
    previewImportedEvents(valid);
  }catch(err){
    console.error('이미지 분석 실패:',err);
    stat.textContent='';
    toast(err.message||'사진 분석에 실패했어요.');
  }
}
function previewImportedEvents(items){
  modal((md,close)=>{
    const head=el('div','mh');head.append(el('div','mt','찾은 일정 확인'),el('button','ic','×'));head.lastChild.onclick=close;md.append(head);
    md.append(el('div','empty','AI가 잘못 읽을 수 있어요. 제목과 날짜를 확인하고 수정한 뒤 저장해 주세요.'));
    const rows=[];
    items.slice(0,30).forEach((it,idx)=>{
      const box=el('div','ec');box.style.display='block';box.style.padding='12px';
      const row1=el('div','row');const ck=el('input');ck.type='checkbox';ck.checked=true;ck.style.width='auto';
      const title=el('input');title.type='text';title.value=it.title.slice(0,80);title.setAttribute('aria-label','일정 제목');row1.append(ck,title);
      const row2=el('div','row');const date=el('input');date.type='date';date.value=it.date;const start=el('input');start.type='time';start.value=/^\d{2}:\d{2}$/.test(it.start||'')?it.start:'';const end=el('input');end.type='time';end.value=/^\d{2}:\d{2}$/.test(it.end||'')?it.end:'';
      row2.append(date,start,end);box.append(row1,row2);md.append(box);
      rows.push({ck,title,date,start,end});
    });
    const save=el('button','primary big','선택한 일정 저장');
    save.onclick=async()=>{
      const chosen=rows.filter(r=>r.ck.checked&&r.title.value.trim()&&r.date.value);
      if(!chosen.length){toast('저장할 일정을 선택해 주세요.');return}
      if(!db){toast('Firebase 연결을 확인해 주세요.');return}
      save.disabled=true;save.textContent='저장 중…';
      try{
        for(const r of chosen){await saveEvent({title:r.title.value.trim().slice(0,80),date:r.date.value,start:r.start.value,end:r.end.value,owner:me.id,shared:$('#imgShared').checked,src:'image'});}
        const first=new Date(chosen[0].date.value+'T00:00:00');view=new Date(first.getFullYear(),first.getMonth(),1);render();close();toast(chosen.length+'개 일정을 공유 달력에 저장했어요!');
      }catch(e){console.error(e);toast('저장에 실패했어요. Firebase 연결을 확인해 주세요.');save.disabled=false;save.textContent='선택한 일정 저장';}
    };
    md.append(save);
  });
}

    if (typeof firebase === 'undefined') throw Error('Firebase SDK를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
    firebase.initializeApp(firebaseConfig);
    const authResult = await firebase.auth().signInAnonymously();
    if (!authResult || !authResult.user) throw Error('Firebase 익명 인증에 실패했어요.');
    db=firebase.firestore();
    // Firebase 연결 상태를 확인할 수 있도록 안내를 표시합니다.
    console.info('Firebase 익명 인증 연결 완료');
    // 기존 닉네임/사용자 구분은 브라우저에 저장된 me.id로 유지됩니다.
    const onErr=err=>{console.error('Firestore 동기화 실패:',err);banner('Firestore 동기화 실패: '+((err&&err.code)||(err&&err.message)||'알 수 없는 오류')+' — Firebase 규칙을 확인해 주세요.');};
    db.collection('events').onSnapshot(s=>{events=s.docs.map(d=>({id:d.id,...d.data()}));render()},onErr);
    db.collection('members').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());members=m;render()},onErr);
    db.collection('settings').doc('couple').onSnapshot(s=>{since=s.exists?(s.data().since||null):null;buildA();render()},onErr);
    db.collection('ddays').onSnapshot(s=>{ddays=s.docs.map(d=>({id:d.id,...d.data()}));render()},onErr);
    if(me)await syncMe();
  } catch(err) {
    console.error('Firebase 연결 실패:',err);
    banner('Firebase 연결 실패: '+((err&&err.code)|| (err&&err.message)||'알 수 없는 오류')+' — Firebase 익명 인증 설정과 인터넷 연결을 확인해 주세요.');
  }
})();

</script>
</body>
</html>
